
[project]
name = "multi-agent-research"
version = "0.1.0"
description = "Multi-agent research pipeline using Mistral, LangChain, and Tavily"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langchain",
    "langchain-core",
    "langchain-community",
    "langchain-mistralai",
    "langgraph",
    "tavily-python",
    "beautifulsoup4",
    "requests",
    "python-dotenv",
    "sqlalchemy>=2.1.5",
    "pwdlib>=0.3.1",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
    "email-validator>=2.3.0",
    "python-multipart>=0.0.32",
]

[tool.uv]
package = false
